name: Verify static application
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - uses: pnpm/action-setup@v4
        with:
          version: '12.18.0'
      - name: Install (bootstrap lockfile on first connected run)
        shell: bash
        run: |
          if test -f pnpm-lock.yaml; then
            pnpm install --frozen-lockfile
          else
            pnpm install --no-frozen-lockfile
          fi
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm build:portable
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Keep generated site and initial lockfile
        uses: actions/upload-artifact@v4
        with:
          name: static-site-and-lockfile
          path: |
            dist/
            portable/
            pnpm-lock.yaml
      - name: Browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
