p":"1画面・1能力・足場3〜5枚で、着地と状態変化が直結することを検証","risk":"タグに合わせた特別なルールは未設計。単なるテーマ付けになる可能性あり。","origin":"prior-brainstorm"},{"id":"F497","tagId":"tag:312","mechanicId":"ECO-16","conceptId":"","title":"","rule":"移動能力や足場を貨幣・資源として扱う。ボス装置に資金を渡して罠を一度遅らせる。他者がより高額を払うと再起動","example":"アイデア検証段階：まずボス装置に資金を渡して罠を一度遅らせる。他者がより高額を払うと再起動 の1画面試作を行う。","mvp":"1画面・1能力・足場3〜5枚で、着地と状態変化が直結することを検証","risk":"タグに合わせた特別なルールは未設計。単なるテーマ付けになる可能性あり。","origin":"prior-brainstorm"},{"id":"F498","tagId":"tag:365","mechanicId":"RES-15","conceptId":"","title":"","rule":"入力精度・判断結果をその場の地形で解決する。他プレイヤーの着地成功で得る投票権で、次の部屋の重力や罠周期を決める","example":"アイデア検証段階：まず他プレイヤーの着地成功で得る投票権で、次の部屋の重力や罠周期を決める の1画面試作を行う。","mvp":"1画面・1能力・足場3〜5枚で、着地と状態変化が直結することを検証","risk":"タグに合わせた特別なルールは未設計。単なるテーマ付けになる可能性あり。","origin":"prior-brainstorm"},{"id":"F499","tagId":"tag:36","mechanicId":"ACT-18","conceptId":"","title":"","rule":"技の選択肢を空中動作／着地で増減させる。救助する人物ごとに未来の足場配置が変わり、難しいルートが物語の選択肢になる","example":"アイデア検証段階：まず救助する人物ごとに未来の足場配置が変わり、難しいルートが物語の選択肢になる の1画面試作を行う。","mvp":"1画面・1能力・足場3〜5枚で、着地と状態変化が直結することを検証","risk":"タグに合わせた特別なルールは未設計。単なるテーマ付けになる可能性あり。","origin":"prior-brainstorm"},{"id":"F500","tagId":"tag:261","mechanicId":"VIC-08","conceptId":"","title":"","rule":"クリア条件・勝敗判定を軌道・着地から決める。縮む塔で落下したプレイヤーはそのラウンド脱落。待機場所も次第に消える","example":"アイデア検証段階：まず縮む塔で落下したプレイヤーはそのラウンド脱落。待機場所も次第に消える の1画面試作を行う。","mvp":"1画面・1能力・足場3〜5枚で、着地と状態変化が直結することを検証","risk":"タグに合わせた特別なルールは未設計。単なるテーマ付けになる可能性あり。","origin":"prior-brainstorm"}],"concepts":[{"id":"C01","title":"工場が自分をコピーする","materials":["tag:177","tag:308","tag:82","MOV-10","ACT-06","WPL-05"],"rule":"クリアしたジャンプ軌道が次回は自動搬送機として再生される。自分が移動しているあいだ工場を組み立てる。","example":"一周目は上段のスイッチへ跳ぶ。二周目には一周目の分身が部品を運び、三周目には完成したベルトを足場に使う。","mvp":"1画面・記録ルート2本・搬送物1種・スイッチ3個","risk":"コピーが多すぎると待機時間が増える。装置の目的をコース突破に絞る。","novelty":"ステージを攻略すると同時に、未来の自分の移動設備を設計している。"},{"id":"C02","title":"ジャンプの借金","materials":["tag:113","tag:345","tag:68","ECO-07","MOV-05","TRN-13"],"rule":"ダッシュ能力を先の区間から借りて今使える。負債は次の部屋の最低速度やジャンプ不能時間になる。","example":"入口の大穴を3回ダッシュで越えると、出口前の狭い段差でジャンプ回数が3回減る。前半を節約すると後半が楽。","mvp":"全5部屋・ダッシュ前借り3回・負債表示","risk":"後半に詰みやすいので負債を精算する代替経路を必ず残す。","novelty":"最適解は局所的最速ではなく、未来の運動能力を残す経路。"},{"id":"C03","title":"種をまく着地","materials":["tag:221","tag:101","tag:57","ECO-06","MOV-18","WPL-07"],"rule":"着地地点に植物が生え、成長するにつれ弾性足場へ変化する。成功した挑戦も失敗も畑を編集する。","example":"狭い土の足場へ三度着地すると蔓が伸びる。4回目はその蔓に飛びついて高い棚へ行ける。","mvp":"種1種類・成長3段階・7つの土床・1部屋","risk":"時間待ちだけで解けないよう着地回数と位置を育成条件にする。","novelty":"農業が報酬画面ではなく、運動の履歴で作る地形そのもの。"},{"id":"C04","title":"盗品は重い","materials":["tag:320","tag:364","tag:120","UNC-02","ECO-15","MOV-05"],"rule":"盗品を拾うほどジャンプ速度が下がり、着地時の慣性が増える。契約達成額と脱出成功のトレードオフ。","example":"帰還可能な20秒地点で脱出するか、さらに重い金庫を奪い、狭い通路の難度を上げるか決断する。","mvp":"重さ3段階・金庫5個・脱出扉2個","risk":"荷物でアクションの気持ちよさが壊れないよう軌道を予測表示する。","novelty":"高難易度アクションの難易度選択を、プレイヤーが欲を出すことで毎回発生させる。"},{"id":"C05","title":"着地の奏者","materials":["tag:224","tag:331","tag:121","ACT-06","TRN-12","SET-05"],"rule":"着地タイミングが音符になり、作ったリズムが次の足場の上下周期になる。","example":"1周目で短短長の着地パターンを作ると、2周目のリフトが短短長で動く。演奏と精密ジャンプが相互設計。","mvp":"4拍ループ・4枚の足場・ドラム3音","risk":"リズムが苦手でも物理と拍が読み取れる予告を表示。","novelty":"ステージBGMと移動床を同じプレイヤー演奏から生成できる。"},{"id":"C06","title":"マンカラ貨物港","materials":["tag:274","tag:68","tag:69","MOV-12","ECO-20","SET-02"],"rule":"着地した倉庫から資源が隣の浮島に順送りされ、積載量に応じて足場の高さ・速度が変わる。","example":"倉庫Aに4箱。Aに跳び乗るとB〜Eに1箱ずつ移り、BとDが上昇する。上昇時間中に連続ジャンプ。","mvp":"横並び6倉庫・4箱・荷重反応床3種","risk":"石の配布と次のジャンプ軌道を一画面で理解できるUIが必要。","novelty":"輸送最適化がダイレクトに足場の配置を決める。"},{"id":"C07","title":"配送ルートの競り","materials":["tag:214","tag:52","tag:226","ECO-15","TRN-03","AUC-14"],"rule":"複数人が正確な着地で配送契約を競り落とし、落札した配送品で自機の重量と経路が変わる。","example":"時間内に金の足場中心へ最も近く着地した者が軽い高価貨物を獲得。敗者は重い貨物の別経路を走る。","mvp":"同画面2人・契約2種・着地誤差の採点","risk":"実力差が拡大しないよう敗者側契約に補償を付与。","novelty":"着地の上手さが経済交渉の決定権になるが、その先に新しい走行差が生まれる。"},{"id":"C08","title":"四つの技の輪","materials":["tag:123","tag:184","tag:89","ACT-10","ACT-11","CAR-08"],"rule":"着地するたびダッシュ・二段跳び・急停止・重力反転が輪を一つ進み、選べる技が変わる。","example":"次の長距離区間へダッシュを合わせるため、わざと途中の足場を1回踏み、技順を調整する。","mvp":"4能力・短い8部屋・ボタン2つ","risk":"能力を使うための単調な空踏みが増えないレベル配置にする。","novelty":"正確な操作と技の並び替えを一つの着地操作に統合する。"},{"id":"C09","title":"生きたステージの飼育","materials":["tag:196","tag:239","tag:119","WPL-02","MOV-21","ECO-06"],"rule":"捕まえた生物が足場そのものになり、育成状態・性格によってジャンプ時の反発と移動を変える。","example":"弾力の強い生物を棚へ配置、重い生物をスイッチに配置。両方育てると初めて上段へ届く。","mvp":"生物3種・足場スロット5つ・成長2段階","risk":"システムが複雑なので生物能力は最初は見た目から推測可能に。","novelty":"コレクションが能力の数値ではなく、物理的な地形編集になる。"},{"id":"C10","title":"弾幕の取り引き","materials":["tag:111","tag:45","tag:57","RES-08","ARC-05","UNC-08"],"rule":"二人のプレイヤーは共有ボスの弾道を一時変更できる。変更すると自分も相手も足場を得るが攻撃リスクも増える。","example":"Aが弾を横向きに誘導し空中足場を作る。Bはその足場を先取り。協力と裏切りが交互に発生。","mvp":"固定砲台1種・弾に乗れる・2人共有画面","risk":"相手にしか不利益がない選択肢を設けない。","novelty":"弾幕の誘導を囚人のジレンマにして、回避技能と協力判断を結ぶ。"},{"id":"C11","title":"前周の軌跡が配線になる","materials":["tag:125","tag:71","tag:156","STR-09","SET-04","MOV-22"],"rule":"毎回の移動軌跡が次周に電線として残り、閉ループを作ると対応するステージ機構が作動する。","example":"最初の周に左半分の軌跡を描き、リセット後に右半分をジャンプ。2軌跡がつながると扉が開く。","mvp":"3周上限・軌跡保存・導通判定・扉3つ","risk":"大量の線の視認性と残存ルールを明瞭に。","novelty":"繰り返しを試行錯誤ではなく回路の描画工程に転換する。"},{"id":"C12","title":"見られない床","materials":["tag:32","tag:168","tag:97","ARC-08","UNC-12","UNC-13"],"rule":"特定の物体を視認している間だけ床が存在し、観測可能な位置から安全経路を推理する。","example":"赤い灯りを視界に入れると橋が現れるが、敵の視線も通る。身を隠すと橋が消えるため途中で跳ぶ。","mvp":"視線判定・灯り2つ・敵1体・橋3枚","risk":"画面外の情報で理不尽な落下を起こさない。","novelty":"視線が視覚演出ではなく「床が有るか」の決定変数になる。"},{"id":"C13","title":"ピンボール・パルクール","materials":["tag:374","tag:369","tag:57","MOV-06","RES-24","MOV-09"],"rule":"主人公を一回だけ発射し、空中でピンボールのフリッパーを叩いて運動方向を変える。","example":"一投で跳ねた球を空中のフリッパーで二回はじき、狭いカップへ導く。","mvp":"放物運動・フリッパー2基・カップ3つ","risk":"物理を決定論に固定し、失敗の原因を読み取れるようにする。","novelty":"狙いを定める静的なゴルフと即時反応の精密操作を交互に要求する。"},{"id":"C14","title":"音を消す忍者","materials":["tag:134","tag:224","tag:72","UNC-06","ARC-08","TRN-12"],"rule":"足場の材質と着地のタイミングで音量が決まり、敵の聴覚範囲を避けながら進む。","example":"金属床へ着地すると警備員が振り向くが、ドラムの大音量に合わせて着地すると足音がかき消される。","mvp":"床材3種・監視員1体・8拍の騒音ループ","risk":"リズムの視覚化なしに聴覚だけを要求しない。","novelty":"ジャンプの着地タイミングをステルスの騒音マネジメントにする。"},{"id":"C15","title":"釣り糸で都市を飛ぶ","materials":["tag:259","tag:209","tag:57","MOV-09","MOV-20","RES-25"],"rule":"釣り糸を建物の突起に引っかけて振り子移動。糸の長さ・張力・荷物重量が飛距離を決める。","example":"狭い空中フックへ針を投げ、振り子の最下点で離して次の足場へ飛ぶ。","mvp":"糸・フック5個・張力ゲージ・一画面","risk":"張力による予想外の死亡を減らす速度ガイドが必要。","novelty":"釣りの「投げる・掛ける・引く」をパルクールの移動操作そのものにする。"},{"id":"C16","title":"箱を押した反力で飛ぶ","materials":["tag:311","tag:57","tag:125","ACT-21","MOV-13","RES-24"],"rule":"空中で箱を押すと、箱が進むのと同じだけ主人公が逆方向へ飛ぶ。反動で次の箱へ渡る。","example":"箱を右へ押し出して自分を左上へ弾き、押した箱が戻るタイミングで着地する。","mvp":"箱2種・押し2方向・短い8ステージ","risk":"質量差のルールと反力をアニメーションで予告する。","novelty":"倉庫番の箱押しが、同時に自分の姿勢と位置を変える物理操作になる。"},{"id":"C17","title":"着地でチェスする","materials":["tag:360","tag:99","tag:45","MOV-03","VIC-14","TRN-09"],"rule":"2人がジャンプでマスへ到達するとそのマスに駒を配置でき、配置後にチェス的な攻撃範囲が発生する。","example":"Aが高い足場から中央へ飛んでルークを置き通路を支配。Bはナイト型の経路で支配を迂回する。","mvp":"小型5×5盤・駒2種・2人交代プレイ","risk":"チェスの完全なルールは最初は持ち込まない。","novelty":"到達難易度と盤面の位置価値が結びつく。"},{"id":"C18","title":"小惑星を踏み渡る","materials":["tag:91","tag:263","tag:210","MOV-11","MOV-09","ARC-05"],"rule":"小惑星ごとに重力中心が違い、着地すると島の重力を隣接島へ少し転送する。","example":"小惑星Aから離陸してBへ着地。Bの重力が増した結果、次にCへ渡る放物線が変わる。","mvp":"2D重力源3つ・転送ルール・予測軌道","risk":"6DOFは表現タグとして参考扱い、MVPは2D重力で検証。","novelty":"移動そのものが重力場を再配分するため、宇宙空間の足場が盤面として変化する。"},{"id":"C19","title":"屋上を所有する","materials":["tag:187","tag:113","tag:209","ECO-14","ECO-13","VIC-14"],"rule":"着地した屋上の所有権を獲得し、所有する建物同士をジャンプで接続すると通行料と新しい足場が発生する。","example":"A→B→Cと精密ジャンプで繋ぐと都市の輸送路が開通。だが高収益ビル間の距離は厳しい。","mvp":"8屋根・所有権・収入・道路可視化","risk":"経営だけで高所を突破できないよう技術的難所を残す。","novelty":"都市経営の立地とジャンプの到達可能性が同じ空間制約になる。"},{"id":"C20","title":"見えているのは片方だけ","materials":["tag:33","tag:272","tag:125","UNC-06","STR-02","WPL-08"],"rule":"Aは危険な床を見られるがジャンプできず、Bはジャンプできるが床の種類を見られない。互いに情報伝達。","example":"Aが踏む順を伝え、Bが2連続の細い足場を跳ぶ。途中でAとBの役割が入れ替わる。","mvp":"二役・床の視認切り替え・6部屋","risk":"一人操作モードはモード分割による擬似協力で代替可能。","novelty":"相互依存がチャット機能ではなく、視認と操作の非対称性から生まれる。"},{"id":"C21","title":"重力を壊したのは誰","materials":["tag:365","tag:45","tag:205","UNC-04","STR-07","ARC-05"],"rule":"4人のうち1人は短時間だけ重力を変えられる。ジャンプの着地誤差・重力変化の痕跡から妨害者を推理する。","example":"突然全員が左へ流される。被害が少なかった人を疑うが、本人が上手いだけかもしれない。","mvp":"ローカル4人・重力変更1種・投票1回","risk":"推理が難しいので変化のログを一定量残す。","novelty":"正確な移動の履歴が推理の証拠になる。"},{"id":"C22","title":"足場を取引する","materials":["tag:214","tag:113","tag:18","ECO-02","RES-08","TRN-09"],"rule":"プレイヤー間で足場の所有権やダッシュ回数を売買する。交換結果が次のステージの到達可能性に直結。","example":"Aは余った二段跳びをBに渡し、Bから高所足場の通行権を買う。誰が先に難所へ挑むか交渉する。","mvp":"2人・4取引アイテム・5つの足場","risk":"交渉が長引きリズムを損ねないよう制限時間を設定。","novelty":"資産が数値ではなく、物理的に届く地形・跳べる回数として機能する。"},{"id":"C23","title":"削った床で加速する","materials":["tag:201","tag:219","tag:71","MOV-17","ECO-20","TRN-13"],"rule":"加速しながら踏んだ床が削れて消える。床の破片は次の区間へ飛び新たな足場を作る。","example":"最短経路でゴールへ走ったが、床を破壊しすぎて次のラップに足場が残らない。","mvp":"破壊床・破片足場・3周の反復コース","risk":"地形変化が読めないランダム破片は採用しない。","novelty":"短距離の最速ラインと長期の地形維持を衝突させる。"},{"id":"C24","title":"VR側はステージの巨人","materials":["tag:383","tag:140","tag:203","WPL-08","ARC-06","MOV-16"],"rule":"VRプレイヤーは巨大な箱や足場を動かし、2D走者はその操作中に細い地形を精密に跳ぶ。","example":"VR側が高い足場を左へ移動させる間、走者が壁蹴りで上がって次の箱へ乗り移る。","mvp":"VR無しでもマウス操作対2D操作で検証可能","risk":"視点間の情報格差を減らす俯瞰ガイドを付ける。","novelty":"制作ツールと操作アクションの時間差が協力プレイになる。"},{"id":"C25","title":"着地が配当を生む","materials":["tag:101","tag:127","tag:65","ECO-06","SET-05","VIC-01"],"rule":"連続パーフェクト着地で生産機が加速し、獲得資源が次に挑戦できる高難度ルートを開く。","example":"10連続着地で生産倍率が上がるが、1回ミスすると倍率がリセット。自動生産の間は危険なルートへ投資できる。","mvp":"着地判定・コンボ乗数・部屋3つ","risk":"放置だけでクリアできる設計にしない。","novelty":"クリッカー的な生産をジャンプ精度という身体技能で駆動する。"},{"id":"C26","title":"防衛タワーの配達員","materials":["tag:172","tag:173","tag:68","WPL-07","TRN-07","ARC-07"],"rule":"敵が侵入するリアルタイムの塔を駆け上がり、弾薬を各防衛塔に物理的に配達する。","example":"左の砲塔が残弾1。上段へ最短で跳ぶか、右側砲塔に寄って資源を分配するか即断する。","mvp":"敵1ルート・砲塔2基・運搬アイテム1種","risk":"忙しさが操作ミスの理不尽さにならないようウェーブ停止を入れる。","novelty":"タワーディフェンスの優先順位を精密なルート選択として遊ばせる。"},{"id":"C27","title":"魔法を使うと次周に請求","materials":["tag:66","tag:123","tag:67","ECO-07","CAR-08","ACT-03"],"rule":"魔法カードは現在の部屋では無制限に使えるが、使った分だけ次の部屋で回復待ちや空白床が増える。","example":"重力反転を2回使って難所をショートカットすると、次の部屋では着地ごとの硬直が増える。","mvp":"4枚の魔法・3部屋・負債2種","risk":"初心者は失敗時に返済負担を解除できるようにする。","novelty":"ビルドの強さではなく、未来への負債を含む魔法運用が攻略となる。"},{"id":"C28","title":"見つからない衝突判定","materials":["tag:62","tag:109","tag:138","UNC-07","UNC-12","RES-17"],"rule":"足場の一部に見えない衝突判定があるが、敵の足音や光の反射から規則を推理できる。","example":"鏡の中にだけ見える踏み石の位置を推理し、1ピクセル単位でそこに着地する。","mvp":"反射手掛かり2種・透明床6枚・短い3部屋","risk":"情報不足の当てずっぽうジャンプを禁止する。","novelty":"観察と精密操作が同じ対象の表裏になり、初見殺しを推理可能にする。"},{"id":"C29","title":"赤青スイッチでプログラム","materials":["tag:177","tag:308","tag:33","MOV-10","ACT-06","STR-02"],"rule":"跳んで通過したスイッチ列が自動機の動作プログラムになり、別の走者がその機械上で攻略する。","example":"Aが赤青赤の順番で端末に着地。搬送機が左右左と動き、Bが移動床を乗り継ぐ。","mvp":"2人・3スイッチ・搬送機1台・操作の記録","risk":"単独プレイ時はAとBを交互に操作する。","novelty":"スイッチの押下順序をルートの幾何学的設計にする。"},{"id":"C30","title":"撃つ弾が譜面になる","materials":["tag:224","tag:111","tag:148","TRN-13","CAR-05","RES-20"],"rule":"装備カードで敵の弾幕周期を変更し、その弾の間をリズムジャンプで突破する。","example":"4拍で撃つ敵に変拍子カードを混ぜ、3拍目に空いた穴へ飛び込む。","mvp":"弾幕1種・テンポ3種・カード6枚","risk":"カードで安全地帯を作れ過ぎると精密性が消える。","novelty":"デッキ構築をスキル強化ではなく、敵の攻撃リズムの編集に使う。"},{"id":"C31","title":"群れを足場にする","materials":["tag:271","tag:196","tag:57","MOV-15","WPL-02","ARC-06"],"rule":"空を飛ぶ小動物の群れを着地で誘導し、集まった群れを一時的な足場として利用する。","example":"中央の止まり木に1匹着地させ、群れが集まった瞬間にその上へ乗り移る。","mvp":"群れ5個体・移動AI1規則・足場化条件","risk":"群れの位置が確率でぶれないよう行動を決定論化。","novelty":"仲間を集めるというメカニクスを移動経路の生成にする。"},{"id":"C32","title":"地下の送電採掘","materials":["tag:244","tag:177","tag:57","SET-03","ECO-05","MOV-18"],"rule":"掘った空洞が移動経路となり、着地で動かした鉱石が発電源になる。掘削とパルクールを同じ地形で行う。","example":"まず壁に沿って細い穴を掘る。そこを高速で駆け抜けると発電機が起動し、上部の搬送路が動く。","mvp":"掘れる壁1種・動力連結・部屋3つ","risk":"壁を好きに削れるとジャンプ攻略が消えるので掘削には制約。","novelty":"採掘で経路を作り、その経路で採掘を自動化する循環。"},{"id":"C33","title":"地図が消えるタイムアタック","materials":["tag:345","tag:63","tag:175","MOV-17","UNC-02","VIC-15"],"rule":"通過した足場は永久に消える。一発でクリアできなければ、その試行中に使える地形が減り続ける。","example":"近道を選んだが落下して復帰、落ちた地点の床がないため遠回り。続行するか早期リセットかを判断する。","mvp":"分岐路2本・床消失・即時リトライ","risk":"理不尽な不可逆詰みは手動全リセットで緩和。","novelty":"スピードランとプッシュ・ユア・ラックの判断を一体化。"},{"id":"C34","title":"完璧着地の株式市場","materials":["tag:121","tag:189","tag:272","AUC-14","ECO-13","VIC-03"],"rule":"他人のゴーストの着地精度に投資でき、自分でより精密に跳んで価値を更新する。","example":"他者の記録に投資したあと、本人が記録更新すると配当。自分は別の難所へ挑戦して株価を変える。","mvp":"ローカル記録5人分・仮想通貨・順位差の計算","risk":"実貨幣は使わずゲーム内ポイント限定。","novelty":"リーダーボードを貨幣化した競技経済として扱う。"},{"id":"C35","title":"残り一本の橋","materials":["tag:104","tag:55","tag:81","SET-04","ECO-20","MOV-16"],"rule":"持てる建設資材が限られ、精密に着地した2地点を橋でつなげる。ただし次の橋には材料が残らない。","example":"最初の渓谷に橋を3枚使って越えると次が厳しい。最適な踏切りで橋を節約する。","mvp":"橋ピース7枚・エリア2つ・短いコース","risk":"建設モードの操作がアクションと断絶しないよう自動スナップ。","novelty":"建設資材が行動回数ではなく足場の長さになる。"},{"id":"C36","title":"犯人は前周の自分","materials":["tag:168","tag:268","tag:138","UNC-13","MOV-24","STR-09"],"rule":"失敗した周の自分は次周に姿が見えず、床のへこみや装置反応だけが残る。痕跡から動きを推定する。","example":"一見空の部屋でスイッチが入る。前周のゴーストがいる位置を推理し、衝突しないようジャンプする。","mvp":"ゴースト1体・環境手掛かり3種・5部屋","risk":"謎が解けた後は短い操作で解決できるようにする。","novelty":"推理の対象がナラティブではなく、物理的に同時に存在する自分の履歴になる。"},{"id":"C37","title":"羊の足場を積む","materials":["tag:221","tag:271","tag:82","WPL-02","RES-25","SET-02"],"rule":"羊などの動物を着地で特定の囲いへ誘導し、群れを積んで柔らかな塔や弾性ジャンプ台にする。","example":"羊を3匹集めると一段高い足場ができる。4匹だと重心が崩れ、逆に危険になる。","mvp":"動物3匹・積層判定・反発力2段階","risk":"動物の挙動が不安定だと苦痛なので大部分は固定ルール。","novelty":"育成/牧畜の数量管理を直接跳躍物理に変換。"},{"id":"C38","title":"ターン制の弾幕走者","materials":["tag:76","tag:161","tag:268","TRN-15","RES-20","ACT-06"],"rule":"空中では時間が進み、着地中は敵が停止。次の動作を入力して離陸すると敵の攻撃も一斉に実行される。","example":"小さな床で次の進路を入力し、ジャンプで3発の弾をかいくぐり、次の着地で計画を修正する。","mvp":"2D側面・敵1種・飛行中のみ敵移動","risk":"停止時間が長すぎると精密操作の勢いを損ねる。","novelty":"ターン制の意思決定境界が自然な着地イベントに一致。"},{"id":"C39","title":"剣戟のジャンプ間合い","materials":["tag:230","tag:372","tag:233","RES-07","RES-20","VIC-17"],"rule":"空中斬り・着地斬り・弾き返しが三すくみ。着地地点によって相手の反撃距離と王座占有時間が変わる。","example":"大振りの敵に壁ジャンプで背後へ回り、空中斬りは弾かれるため着地瞬間を狙う。","mvp":"敵1体・技3種・位置取り得点","risk":"判定は見た目と一致させてフレーム罠を避ける。","novelty":"精密位置合わせが戦闘読み合いそのものになる。"},{"id":"C40","title":"スペルを跳びながら書く","materials":["tag:304","tag:241","tag:184","ACT-05","SET-05","CAR-08"],"rule":"着地した文字タイルを順に読むと呪文が発動し、呪文そのものが次の移動能力を作る。","example":"H→O→Pの順で跳ぶとHOPを成立させ、次の大穴で二段跳びを獲得する。","mvp":"アルファベット6枚・呪文3つ・一画面","risk":"語彙力より空間ルールに比重を置く。","novelty":"単語の選択とジャンプ経路の最適化を同じ盤面で解く。"},{"id":"C41","title":"列車が作る階段","materials":["tag:303","tag:274","tag:14 function uid(prefix = 'n') { return `${prefix}-${globalThis.crypto?.randomUUID?.() ?? `${Date.now().toString(36)}-${Math.random().toString(36).slice(2)}`}`; }

function searchMaterials(c, opts = {}) {

    undo() {

            return;

        this.emit();
    }
    redo() {
        const w = this.future.pop();

    addNote(position = { x: 250, y: 180 }) { const n = { id: uid('note'), type: 'note', position, width: 270, height: 170, data: { title: 'ひとつの問い', body: 'この組み合わせで、プレイヤーの選択はどう変わる？', tone: 'yellow' } }; this.updateBoard(b => ({ ...b, nodes: [...b.nodes, n] })); this.ui({ selected: [n.id], selectedEdge: null, panel: 'inspect' }); }
    addIdea(h, position) { const b = this.board(), bb = bounds(b.nodes.filter(n => n.type !== 'frame')); const n = makeIdeaNode(h, position ?? { x: bb.x + bb.width + 100, y: bb.y + 50 }); const sources = b.nodes.filter(x => x.data.materialId && h.materials.includes(x.data.materialId)); this.updateBoard(b => ({ ...b, nodes: [...b.nodes, n], edges: [...b.edges, ...sources.map(s => ({ id: uid('edge'), source: s.id, target: n.id, label: '素材にする' }))] })); this.ui({ selected: [n.id], selectedEdge: null, panel: 'inspect', toast: '仮説をボードに追加しました' }); return n.id; }
    addConcept(id) {

        const baseId = this.catalog.materials.find(m => m.label === 'Precision Platformer').id;
        const hs = { ...c, operator: 'translate', origin: '既存のブレスト例（精密プラットフォーマー向け）', baseId, question: c.novelty };
        const x = bb.x + bb.width + 110, y = bb.y;
        const ns = c.materials.map((mid, i) => makeMaterialNode(this.catalog, mid, { x: x + Math.floor(i / 3) * 275, y: y + (i % 3) * 170 }));
        const idea = makeIdeaNode(hs, { x: x + Math.ceil(ns.length / 3) * 275 + 30, y: y + 80 });
        this.updateBoard(b => ({ ...b, nodes: [...b.nodes, ...ns, idea], edges: [...b.edges, ...ns.map(s => ({ id: uid('edge'), source: s.id, target: idea.id, label: '融合する' }))] }));

    }
    patchNode(id, patch) { this.updateBoard(b => ({ ...b, nodes: b.nodes.map(n => n.id === id ? { ...n, data: { ...n.data, ...patch } } : n) })); }
    moveNodes(positions) { this.updateBoard(b => ({ ...b, nodes: b.nodes.map(n => positions[n.id] ? { ...n, position: positions[n.id] } : n) }), false); }
    setViewport(viewport) { this.updateBoard(b => ({ ...b, viewport }), false); }
    select(id, add = false) { const prev = this.state.selected; this.ui({ selected: add ? (prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]) : [id], selectedEdge: null }); }
    connect(source, target) {
        const b = this.board();
        if (source === target || !b.nodes.some(n => n.id === source) || !b.nodes.some(n => n.id === target) || b.edges.some(e => e.source === source && e.target === target))

    }

    duplicateSelected() {

        const ns = selection.map(n => ({ ...clone(n), id: remap.get(n.id), position: { x: n.position.x + 50, y: n.position.y + 50 } }));
        const es = this.board().edges.filter(e => remap.has(e.source) && remap.has(e.target)).map(e => ({ ...e, id: uid('edge'), source: remap.get(e.source), target: remap.get(e.target) }));

        const n = { id: uid('frame'), type: 'frame', position: { x: bb.x - 30, y: bb.y - 55 }, width: bb.width + 60, height: bb.height + 85, data: { title: '実験グループ', body: '', tone: 'blue' } };

    arrange() { this.updateBoard(b => { let i = 0; return { ...b, nodes: b.nodes.map(n => n.type === 'frame' ? n : { ...n, position: { x: 60 + (i % 3) * 360, y: 60 + Math.floor(i++ / 3) * 370 } }) }; }); }
    mixSelected() { const ids = this.board().nodes.filter(n => this.state.selected.includes(n.id)).flatMap(n => n.data.materialId ? [n.data.materialId] : (n.data.hypothesis?.materials ?? [])); this.setTray([...this.state.tray, ...ids]); this.ui({ panel: 'lab', mobilePanel: 'lab' }); }
    setTray(ids) { this.ui({ tray: [...new Set(ids)].filter(id => material(this.catalog, id)).slice(0, 12), variant: 0 }); }
    toggleTray(id) { this.setTray(this.state.tray.includes(id) ? this.state.tray.filter(x => x !== id) : [...this.state.tray, id]); }
    favorite(id) { const f = this.state.workspace.favorites; this.commit({ ...this.state.workspace, favorites: f.includes(id) ? f.filter(x => x !== id) : [...f, id] }, false); }
    saveRecipe() {
        if (!this.state.tray.length)
            return;
        const r = { id: uid('recipe'), title: this.state.tray.map(id => material(this.catalog, id)?.label).join(' × ').slice(0, 300), materials: [...this.state.tray], operator: this.state.operator, baseId: this.state.baseId };
        this.commit({ ...this.state.workspace, recipes: [r, ...this.state.workspace.recipes].slice(0, 200) });
        this.ui({ toast: '組み合わせを保存しました' });
    }
    restoreRecipe(id) {
        const r = this.state.workspace.recipes.find(x => x.id === id);
        if (r)
            this.ui({ tray: r.materials, operator: r.operator, baseId: r.baseId, panel: 'lab', variant: 0 });
    }
    newBoard(title = '新しい実験') { const b = blankBoard(title); this.commit({ ...this.state.workspace, boards: [...this.state.workspace.boards, b], activeBoardId: b.id }); this.ui({ selected: [], selectedEdge: null, tray: [], panel: 'lab' }); }
    switchBoard(id) {
        if (!this.state.workspace.boards.some(b => b.id === id))
            return;
        this.commit({ ...this.state.workspace, activeBoardId: id }, false);
        this.ui({ selected: [], selectedEdge: null });
    }
    renameBoard(title) {
        if (title.trim())
            this.updateBoard(b => ({ ...b, title: title.trim().slice(0, 300) }));
    }
    import(json) {
        const w = parseWorkspace(json, this.catalog);
        const boardIds = new Map(w.boards.map(b => [b.id, uid('import')]));
        const boards = w.boards.map(b => ({ ...b, id: boardIds.get(b.id) }));
        if (this.state.workspace.boards.length + boards.length > 40)
            throw new Error('ボードは40件までです。');
        this.commit({ ...this.state.workspace, boards: [...this.state.workspace.boards, ...boards], activeBoardId: boardIds.get(w.activeBoardId), favorites: [...new Set([...this.state.workspace.favorites, ...w.favorites])], recipes: [...this.state.workspace.recipes, ...w.recipes.map(r => ({ ...r, id: uid('recipe') }))].slice(0, 200) });

    }
    restore(storage) {
        const json = storage.getItem(STORAGE_KEY);
        if (!json)
            return;
        const w = parseWorkspace(json, this.catalog);
        this.commit(w, false);
        this.past = [];
        this.future = [];
        this.emit();
    }
    persist(storage) { storage.setItem(STORAGE_KEY, JSON.stringify(this.state.workspace)); }
}

portableRoot.addEventListener('input', e => {

});
portableRoot.addEventListener('change', async (e) => {
    const el = e.target;
    const bind = el.dataset.bind, id = el.dataset.id;
    if (el.id === 'import-file') {
        try {
            const f = el.files?.[0];
            if (!f)
                return;
            if (f.size > MAX_IMPORT_BYTES)
                throw Error('5MB以下のJSONを選んでください。');
            portableStore.import(await f.text());
            fitPortable();
        }
        catch (err) {
            portableStore.ui({ toast: err instanceof Error ? err.message : '読み込みに失敗しました' });
        }
        return;
    }
    if (bind === 'board')
        portableStore.switchBoard(el.value);
    else if (bind === 'chapter')
        portableStore.ui({ chapter: el.value });
    else if (bind === 'base')
        portableStore.ui({ baseId: el.value });
    else if (bind === 'edge' && id)
        portableStore.patchEdge(id, el.value);
    else if (id && bind) {
        const n = portableStore.board().nodes.find(x => x.id === id);
        if (!n)
            return;
        if (bind === 'node-title')
            portableStore.patchNode(id, { title: el.value.slice(0, 300), ...(n.data.hypothesis ? { hypothesis: { ...n.data.hypothesis, title: el.value.slice(0, 300) } } : {}) });

            portableStore.patchNode(id, { body: el.value.slice(0, 8000), ...(n.data.hypothesis ? { hypothesis: { ...n.data.hypothesis, rule: el.value.slice(0, 8000) } } : {}) });

            portableStore.patchNode(id, { status: el.value });
        else if (bind.startsWith('hyp-') && n.data.hypothesis)
            portableStore.patchNode(id, { hypothesis: { ...n.data.hypothesis, [bind.slice(4)]: el.value.slice(0, 8000) } });

portableRoot.addEventListener('dblclick', e => {

portableRoot.addEventListener('dragstart', e => {

portableRoot.addEventListener('drop', e => {
    const canvas = e.target.closest('.canvas');

        return;
    e.preventDefault();

    if (!id || !material(CATALOG_DATA, id))
        return;
    const r = canvas.getBoundingClientRect(), v = portableStore.board().viewport;
    portableStore.addMaterial(id, { x: (e.clientX - r.left - v.x) / v.zoom, y: (e.clientY - r.top - v.y) / v.zoom });

portableRoot.addEventListener('pointerdown', e => {
    const target = e.target, canvas = target.closest('.canvas');
    if (!canvas)
        return;
    const port = target.closest('[data-port]');
    if (port) {
        e.preventDefault();
        portPick(port.dataset.port);
        return;
    }
    const edge = target.closest('[data-edge]');
    if (edge) {
        portableStore.ui({ selected: [], selectedEdge: edge.dataset.edge, panel: 'inspect' });
        return;
    }
    const card = target.closest('[data-node]'), s = pstate(), v = portableStore.board().viewport;
    if (s.tool === 'connect' && card) {
        e.preventDefault();
        portPick(card.dataset.node);
        return;
    }
    if (e.button !== 0 && e.button !== 1)
        return;
    const pan = s.tool === 'pan' || e.button === 1;
    e.preventDefault();
    if (card && !pan) {
        const id = card.dataset.node;
        const now = performance.now();
        if (lastCardClick.id === id && now - lastCardClick.time < 350) {
            lastCardClick = { id: '', time: 0 };
            portableStore.ui({ selected: [id], selectedEdge: null, panel: 'inspect', mobilePanel: innerWidth < 1000 ? 'lab' : s.mobilePanel });
            return;
        }
        lastCardClick = { id, time: now };
        if (e.shiftKey)
            portableStore.select(id, true);
        else if (!s.selected.includes(id))
            portableStore.select(id);
        const ss = pstate();
        const positions = Object.fromEntries(portableStore.board().nodes.filter(n => ss.selected.includes(n.id)).map(n => [n.id, { ...n.position }]));
        portableStore.beginGesture();
        gesture = { mode: 'node', x: e.clientX, y: e.clientY, origin: { x: v.x, y: v.y }, zoom: v.zoom, positions, moved: false, add: false, selection: [] };
    }

window.addEventListener('pointermove', e => {
    if (!gesture)
        return;
    const g = gesture, dx = e.clientX - g.x, dy = e.clientY - g.y;
    if (Math.hypot(dx, dy) < 3 && !g.moved)
        return;
    g.moved = true;
    if (g.mode === 'node') {

    }

        portableStore.setViewport({ x: g.origin.x + dx, y: g.origin.y + dy, zoom: g.zoom });

        boxRect = { x: Math.min(g.origin.x, g.origin.x + dx), y: Math.min(g.origin.y, g.origin.y + dy), w: Math.abs(dx), h: Math.abs(dy) };
        let box = portableRoot.querySelector('.portable-selection');
        if (!box) {
            box = document.createElement('div');
            box.className = 'portable-selection';
            portableRoot.querySelector('.canvas').appendChild(box);
        }
        Object.assign(box.style, { left: boxRect.x + 'px', top: boxRect.y + 'px', width: boxRect.w + 'px', height: boxRect.h + 'px' });
    }
});
function endPortableGesture() {

        const selected = boxRect && g.moved ? portableStore.board().nodes.filter(n => { const x = n.position.x * v.zoom + v.x, y = n.position.y * v.zoom + v.y; return n.type !== 'frame' && x + n.width * v.zoom >= boxRect.x && x <= boxRect.x + boxRect.w && y + n.height * v.zoom >= boxRect.y && y <= boxRect.y + boxRect.h; }).map(n => n.id) : [];

window.addEventListener('pointerup', endPortableGesture);
window.addEventListener('pointercancel', endPortableGesture);
portableRoot.addEventListener('wheel', e => {

window.addEventListener('keydown', e => {
